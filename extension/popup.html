<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Zapee Assistant</title>
    <style>
      body {
        width: 220px;
        margin: 0;
        padding: 12px 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        color: #1f2937;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.4;
        color: #374151;
      }
      button {
        display: block;
        width: 100%;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        background: #16a34a;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #15803d;
      }
    </style>
  </head>
  <body>
    <div id="root">Zapee Assistant</div>
    <script src="popup.js"></script>
  </body>
</html>
